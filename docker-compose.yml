

services:
  mongo:
    image: mongo:latest
    container_name: parka_db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    container_name: parka_server
    ports:
      - "4000:4000"
    depends_on:
      - mongo
    environment:
      - PORT=4000
      - MONGO_URI=mongodb+srv://Mimaras:happyF1@ticket.5pvkrl8.mongodb.net/?appName=Ticket
      - JWT_SECRET=randomKey45


  client:
    build: ./client
    container_name: parka_client
    ports:
      - "5173:5173"
    depends_on:
      - server
    environment:
      - VITE_API_URL=http://localhost:4000
    volumes:
      - ./client/src:/app/src

volumes:
  mongo-data: